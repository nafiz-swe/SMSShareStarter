name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build User and Admin APKs
        run: gradle assembleUserDebug assembleAdminDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sms-share-apks
          path: |
            app/build/outputs/apk/user/debug/*.apk
            app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
